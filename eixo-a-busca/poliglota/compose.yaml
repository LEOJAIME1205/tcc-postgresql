# Arquitetura poliglota do Eixo A: OpenSearch (BM25), Qdrant (HNSW) e o serviço de busca.
services:
  opensearch:
    extends:
      file: ../../harness/orquestracao/modelos.yaml
      service: sistema-sob-teste
    image: opensearchproject/opensearch:3.8.0@sha256:fafe3fc3587088674669235575aa166228c48bdb940294a8cdbbc1da75236a40
    mem_limit: 10g
    memswap_limit: 10g
    stop_grace_period: 2m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms5g -Xmx5g
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    volumes:
      - ${TCC_DADOS_OPENSEARCH:?defina TCC_DADOS_OPENSEARCH}:/usr/share/opensearch/data

  qdrant:
    extends:
      file: ../../harness/orquestracao/modelos.yaml
      service: sistema-sob-teste
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    mem_limit: 9g
    memswap_limit: 9g
    stop_grace_period: 2m
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - ${TCC_DADOS_QDRANT:?defina TCC_DADOS_QDRANT}:/qdrant/storage

  busca:
    extends:
      file: ../../harness/orquestracao/modelos.yaml
      service: sistema-sob-teste
    image: tcc-busca:1
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      TCC_MOTOR: poliglota
      TCC_CONEXOES: "11"
      TCC_EF_BUSCA: "100"
      OPENSEARCH_HOST: opensearch
      QDRANT_HOST: qdrant

  gerador:
    extends:
      file: ../../harness/orquestracao/modelos.yaml
      service: gerador
    image: tcc-gerador-busca:1
    environment:
      TCC_ARQUITETURA: poliglota
      TCC_SERVICO: http://busca:8000
      OPENSEARCH_HOST: opensearch
      QDRANT_HOST: qdrant
    volumes:
      - ../dados:/app/eixo-a-busca/dados:ro
      - ${TCC_SAIDA:?defina TCC_SAIDA}:/saida
