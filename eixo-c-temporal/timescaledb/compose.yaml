# Eixo C, lado consolidado: PostgreSQL com TimescaleDB, configurado pelo timescaledb-tune (ADR-024 e ADR-063).
services:
  timescaledb:
    extends:
      file: ../../harness/orquestracao/modelos.yaml
      service: postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
      - -c
      - timescaledb.telemetry_level=off
      # Saída congelada do timescaledb-tune 0.19.0 (timescaledb/timescaledb-tune.txt)
      - -c
      - shared_buffers=5GB
      - -c
      - effective_cache_size=15GB
      - -c
      - maintenance_work_mem=2047MB
      - -c
      - work_mem=13653kB
      - -c
      - timescaledb.max_background_workers=16
      - -c
      - max_worker_processes=31
      - -c
      - max_parallel_workers_per_gather=6
      - -c
      - max_parallel_workers=12
      - -c
      - wal_buffers=16MB
      - -c
      - min_wal_size=512MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_locks_per_transaction=512
      - -c
      - autovacuum_max_workers=10
      - -c
      - autovacuum_naptime=10
      - -c
      - default_toast_compression=lz4
      - -c
      - jit=off
      - -c
      - effective_io_concurrency=256
    volumes:
      - ${TCC_DADOS_TIMESCALEDB:?defina TCC_DADOS_TIMESCALEDB}:/var/lib/postgresql

  gerador:
    extends:
      file: ../../harness/orquestracao/modelos.yaml
      service: gerador
    image: tcc-gerador-temporal:1
    environment:
      TCC_ARQUITETURA: timescaledb
      PGHOST: timescaledb
      PGUSER: postgres
      PGPASSWORD: tcc
    volumes:
      - ../dados:/app/eixo-c-temporal/dados:ro
      - ${TCC_SAIDA:?defina TCC_SAIDA}:/saida
