services:
  comum:
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  sistema-sob-teste:
    extends: comum
    cpuset: "0-5,8-13"

  gerador:
    extends: comum
    cpuset: "6-7,14-15"
    mem_limit: 4g
    memswap_limit: 4g

  postgres:
    extends: sistema-sob-teste
    image: tcc-postgres:18.6-ts2.31.0-pgv0.8.7
    mem_limit: 20g
    memswap_limit: 20g
    shm_size: 1g
    stop_grace_period: 2m
    environment:
      POSTGRES_PASSWORD: tcc
    volumes:
      - ${TCC_DADOS_POSTGRES:?defina TCC_DADOS_POSTGRES}:/var/lib/postgresql
