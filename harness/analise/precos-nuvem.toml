# Preços da AWS para o custo em nuvem da QS5 (ADR-071, itens 4 e 6).
#
# Fonte: as tabelas públicas que as páginas de preços do EC2 e do EBS carregam, baixadas em
# 20/11/2026 às 05:20 (horário de Brasília), depois do fim da Fase 3.
#   EC2 sob demanda, Linux, us-east-1 (publicada em 2026-11-20T03:48:50Z):
#     https://b0.p.awsstatic.com/pricing/2.0/meteredUnitMaps/ec2/USD/current/ec2-ondemand-without-sec-sel/US%20East%20(N.%20Virginia)/Linux/index.json
#   EBS (publicada em 2026-11-20T00:50:43Z), linha "Storage General Purpose gp3 GB Mo":
#     https://b0.p.awsstatic.com/pricing/2.0/meteredUnitMaps/ec2/USD/current/ebs.json
# Conferência em agregadores (não usados no cálculo): RunsOn, DevZero, Economize e DoiT.
#
# O gp3 inclui 3000 IOPS e 125 MiB/s por volume; IOPS e vazão provisionadas a mais não entram.
# A AWS cobra o EBS por GB-mês sobre o tamanho provisionado em GiB.

consultado_em = "2026-11-20"
regiao = "us-east-1"
horas_por_mes = 730
gp3_usd_gib_mes = 0.08

