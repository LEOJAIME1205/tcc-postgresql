services:
  postgres:
    extends:
      file: ../../orquestracao/modelos.yaml
      service: postgres
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]

  gerador:
    extends:
      file: ../../orquestracao/modelos.yaml
      service: gerador
    image: tcc-postgres:18.6-ts2.31.0-pgv0.8.7
    entrypoint: ["bash", "/gerador.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: tcc
      PGDATABASE: postgres
    volumes:
      - ./gerador.sh:/gerador.sh:ro
      - ${TCC_SAIDA:?defina TCC_SAIDA}:/saida
