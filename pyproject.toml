[project]
name = "tcc-postgresql"
version = "0.1.0"
description = "Harness experimental do TCC: consolidação em PostgreSQL frente a arquiteturas poliglotas"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy==2.5.4",
    "opensearch-py==3.2.0",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.6",
    "qdrant-client==1.19.1",
]

[dependency-groups]
embeddings = [
    "sentence-transformers==6.1.0",
    "torch==2.14.1",
]

[tool.uv]
package = false
required-version = "==0.12.24"
exclude-newer = "2026-10-16T00:00:00Z"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["harness", "eixo-a-busca", "eixo-b-fila", "eixo-c-temporal"]
