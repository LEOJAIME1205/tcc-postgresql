[project]
name = "tcc-postgresql"
version = "0.1.0"
description = "Harness experimental do TCC: consolidação em PostgreSQL frente a arquiteturas poliglotas"
requires-python = ">=3.14,<3.15"
dependencies = [
    "psycopg[binary]==3.3.6",
]

[tool.uv]
package = false
required-version = "==0.12.24"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["harness", "eixo-a-busca", "eixo-b-fila", "eixo-c-temporal"]
